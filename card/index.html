<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jnuru Goodwin · jnuru.studio</title>
<meta name="description" content="Calm, modern web design for St. Louis small businesses.">
<meta name="theme-color" content="#F5F2EA">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,440;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F2EA; --ink:#2A2826; --mute:#8A847A; --line:#DDD7CB; --press:#ECE7DC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Source Serif 4", Georgia, serif;
    min-height:100dvh; display:flex; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  main{width:100%; max-width:420px; padding:48px 24px calc(40px + env(safe-area-inset-bottom))}

  .label{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--mute)}

  header{display:flex; flex-direction:column; align-items:center; text-align:center}
  .avatar{
    width:128px; height:128px; border-radius:50%; overflow:hidden;
    border:1px solid var(--line); display:grid; place-items:center; margin-bottom:28px;
    background:var(--bg);
  }
  .avatar img{width:100%; height:100%; object-fit:cover}
  .mono{font-variation-settings:"opsz" 60; font-weight:440; font-size:52px; letter-spacing:-.07em; line-height:1; transform:translate(-2px,-4px)}
  h1{font-weight:440; font-variation-settings:"opsz" 40; font-size:32px; letter-spacing:-.01em; line-height:1.1}
  .studio{margin-top:10px}
  .pitch{margin-top:20px; font-size:18px; line-height:1.45; max-width:30ch}

  .actions{margin-top:36px; display:grid; gap:10px}
  .btn{
    display:flex; align-items:center; justify-content:space-between;
    text-decoration:none; color:inherit; font-size:17px;
    padding:18px 20px; border-radius:14px; border:1px solid var(--ink);
    transition:background .15s, transform .15s;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--ink); color:var(--bg)}
  .btn.primary:active{background:#000}
  .btn:not(.primary):active{background:var(--press)}
  .btn small{display:block; font-size:13px; opacity:.65; margin-top:3px}
  .arrow{font-size:20px; line-height:1}

  .links{margin-top:40px; list-style:none; border-top:1px solid var(--line)}
  .links a{
    display:grid; grid-template-columns:34px 1fr auto; align-items:baseline;
    padding:17px 2px; border-bottom:1px solid var(--line);
    text-decoration:none; color:inherit; font-size:17px;
  }
  .links a:active{background:var(--press)}
  .links .n{font-size:11px; color:var(--mute); letter-spacing:.08em}
  .links .v{font-size:14px; color:var(--mute)}

  .lbl{display:inline-flex; align-items:center; gap:10px}
  .ico{width:16px; height:16px; background:var(--ink); display:inline-block; -webkit-mask:var(--m) center/contain no-repeat; mask:var(--m) center/contain no-repeat}
